<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17264d">
<meta name="robots" content="noindex">
<title>You're offline - Club Manager</title>
<!-- Shown by the service worker (public/sw.js) when a page can't load without signal. Self-contained: nothing else
     can be fetched while offline. It lists the pages saved on this phone (tickets, summonses, the dashboard). -->
<style>
  :root { --navy: #17264d; --bg: #f5f3ee; --card: #fff; --fg: #1d2333; --muted: #5f6678; --line: #e3ded2; --link: #2448a8; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1424; --card: #161e33; --fg: #e8eaf2; --muted: #a2a9bd; --line: #26304a; --link: #8fb0ff; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--navy); color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 22px) max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px)); }
  h1 { margin: 0 0 6px; font-size: 24px; }
  header p { margin: 0; color: #d7dcea; }
  main { max-width: 560px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  li + li { border-top: 1px solid var(--line); }
  a.saved { display: block; padding: 14px 16px; color: var(--link); text-decoration: none; font-weight: 600; }
  a.saved span { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
  .empty { color: var(--muted); }
  button { font: 600 16px system-ui, -apple-system, sans-serif; min-height: 48px; border-radius: 12px; border: 0; background: var(--navy); color: #fff; }
  button:focus-visible, a:focus-visible { outline: 3px solid #f3cf6b; outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>You're offline</h1>
  <p>This page needs a signal. These are saved on this phone and open without one.</p>
</header>
<main>
  <ul id="saved" hidden></ul>
  <p class="empty" id="empty" hidden>Nothing is saved on this phone yet. Open a ticket or a summons once while you have signal and it will be here next time.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', () => location.reload());

  // What each saved page is, from the page data the app saved with it.
  function describe(page) {
    const props = page?.props || {};
    switch (page?.component) {
      case 'Members/Dashboard': return ['Your dashboard', 'Your lodges, meetings and events'];
      case 'Member/EventTicket': return ['Ticket: ' + (props.event?.title || 'event'), props.event?.starts_at ? new Date(props.event.starts_at).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : ''];
      case 'Member/Meetings/Summons': return ['Summons: ' + (props.meeting?.title || 'meeting'), props.meeting?.meeting_date ? new Date(props.meeting.meeting_date).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : ''];
      default: return [document.title, ''];
    }
  }

  async function pageData(cache, request) {
    const response = await cache.match(request);
    if (!response) return null;
    if (new URL(request.url).searchParams.has('__inertia')) return response.json();
    const html = await response.text();
    const match = html.match(/<script data-page="app" type="application\/json">([\s\S]*?)<\/script>/);
    return match ? JSON.parse(match[1]) : null;
  }

  (async () => {
    const list = document.getElementById('saved');
    const seen = new Map();
    try {
      const cache = await caches.open('cm-pages-v2');
      for (const request of await cache.keys()) {
        const url = new URL(request.url);
        url.searchParams.delete('__inertia');
        if (seen.has(url.pathname + url.search)) continue;
        try { seen.set(url.pathname + url.search, describe(await pageData(cache, request))); } catch { /* a damaged copy is left out */ }
      }
    } catch { /* no saved pages on this browser */ }

    const entries = [...seen.entries()].sort(([a], [b]) => (a.includes('dashboard') ? -1 : b.includes('dashboard') ? 1 : 0));
    for (const [path, [title, line]] of entries) {
      const link = document.createElement('a');
      link.className = 'saved';
      link.href = path;
      link.textContent = title;
      if (line) { const small = document.createElement('span'); small.textContent = line; link.append(small); }
      const item = document.createElement('li');
      item.append(link);
      list.append(item);
    }
    list.hidden = entries.length === 0;
    document.getElementById('empty').hidden = entries.length > 0;
  })();
</script>
</body>
</html>
