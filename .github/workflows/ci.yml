name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, pdo_sqlite, sqlite3, intl, zip, bcmath
          coverage: none
          ini-values: memory_limit=512M

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install and build frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Tests
        run: |
          set +e
          php artisan test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::$(grep -c ' FAILED ' test-output.log) failed tests"
            sed 's/\x1b\[[0-9;]*m//g' test-output.log > test-plain.log
            grep -E "Exception|Error:|Expected response" test-plain.log | sed 's/^ *//' | cut -c1-300 | sort | uniq -c | sort -rn | head -8 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -A6 -m 4 "FAILED" test-plain.log | grep -v "^--$" | cut -c1-300 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Dependency advisories
        run: |
          composer audit --no-interaction
          npm audit --omit=dev
