name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, pdo_sqlite, sqlite3, intl, zip, bcmath
          coverage: none
          ini-values: memory_limit=512M

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install and build frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Frontend lint
        run: npm run lint

      - name: Template names resolve
        run: npm run check:templates

      - name: Render the components split out of the big pages
        run: npm run check:components

      - name: Check the page editor's element palette
        run: npm run check:blocks

      - name: Check the report date ranges
        run: npm run check:ranges

      - name: Check the accounting screen's addresses
        run: npm run check:urls

      - name: No new off-system colours, button corners, emoji or Title Case labels
        run: npm run check:design

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Tests
        run: php artisan test

      - name: Dependency advisories
        run: |
          composer audit --no-interaction
          npm audit
